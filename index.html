<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tic-Tac-Toe</title>
<style>
  :root {
    --bg: #05050a;
    --panel: #0d0f18;
    --line: #ff0055;
    --x-color: #00f0ff;
    --o-color: #ff0055;
    --text: #f0f0f5;
    --muted: #626c85;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    background-image: 
      radial-gradient(circle at 50% 50%, #120a2a 0%, #05050a 100%),
      linear-gradient(rgba(18, 10, 42, 0.2) 50%, rgba(0, 0, 0, 0.4) 50%);
    background-size: 100% 100%, 100% 4px;
    font-family: "Courier New", Courier, monospace, sans-serif;
    color: var(--text);
  }
  .game {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 28px;
    background: rgba(13, 15, 24, 0.85);
    border: 1px solid #ff0055;
    box-shadow: 0 0 20px rgba(255, 0, 85, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.1);
    border-radius: 4px;
    position: relative;
  }
  .game::before {
    content: "SYS.V2 // 77";
    position: absolute;
    top: 6px;
    right: 10px;
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 1px;
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #00f0ff;
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    text-transform: uppercase;
  }
  .mode-select {
    display: flex;
    gap: 10px;
  }
  .mode-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--muted);
    border-radius: 2px;
    padding: 6px 12px;
    font-size: 0.8rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .mode-btn.active {
    color: #00f0ff;
    border-color: #00f0ff;
    box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
  }
  #status {
    font-size: 1rem;
    color: var(--muted);
    min-height: 1.5em;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #status.win { 
    color: #39ff14; 
    text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
  }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 90px);
    grid-template-rows: repeat(3, 90px);
    gap: 6px;
    background: #ff0055;
    padding: 6px;
    border-radius: 4px;
    box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
  }
  .cell {
    background: var(--panel);
    border: none;
    border-radius: 2px;
    font-size: 2.6rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    transition: all 0.15s ease;
    user-select: none;
  }
  .cell:hover:not(:disabled) {
    background: #1a1e29;
    box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.3);
  }
  .cell:disabled {
    cursor: default;
  }
  .cell.x { 
    color: var(--x-color); 
    text-shadow: 0 0 10px var(--x-color);
  }
  .cell.o { 
    color: var(--o-color); 
    text-shadow: 0 0 10px var(--o-color);
  }
  .cell.win-cell {
    background: rgba(57, 255, 20, 0.2);
    box-shadow: inset 0 0 12px #39ff14;
  }
  button.reset {
    background: transparent;
    color: #00f0ff;
    border: 1px solid #00f0ff;
    border-radius: 2px;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
  }
  button.reset:hover {
    background: #00f0ff;
    color: var(--bg);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
  }
  .scores {
    display: flex;
    gap: 24px;
    font-size: 0.9rem;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .scores span.val { 
    color: var(--text); 
    font-weight: 600; 
  }
</style>
</head>
<body>

<div class="game">
  <h1>Tic-Tac-Toe</h1>
  <div class="mode-select">
    <button class="mode-btn active" id="pvpBtn">PVP</button>
    <button class="mode-btn" id="pvcBtn">VS CPU</button>
  </div>
  <div id="status">X's turn</div>
  <div class="board" id="board"></div>
  <button class="reset" id="resetBtn">New Round</button>
  <div class="scores">
    <div>X: <span class="val" id="scoreX">0</span></div>
    <div>O: <span class="val" id="scoreO">0</span></div>
    <div>Ties: <span class="val" id="scoreT">0</span></div>
  </div>
</div>

<script>
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('resetBtn');
  const pvpBtn = document.getElementById('pvpBtn');
  const pvcBtn = document.getElementById('pvcBtn');
  const scoreXEl = document.getElementById('scoreX');
  const scoreOEl = document.getElementById('scoreO');
  const scoreTEl = document.getElementById('scoreT');

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let cells = Array(9).fill(null);
  let current = 'X';
  let gameOver = false;
  let vsCpu = false;
  let isCpuTurn = false;
  let scores = { X: 0, O: 0, T: 0 };

  function buildBoard() {
    boardEl.innerHTML = '';
    cells.forEach((val, i) => {
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.dataset.index = i;
      btn.addEventListener('click', () => handleMove(i));
      boardEl.appendChild(btn);
    });
  }

  function handleMove(i) {
    if (gameOver || cells[i] || isCpuTurn) return;
    if (vsCpu && current === 'O') return;

    cells[i] = current;
    render();
    
    if (checkGameState()) return;

    current = current === 'X' ? 'O' : 'X';
    statusEl.textContent = `${current}'s turn`;

    if (vsCpu && current === 'O' && !gameOver) {
      isCpuTurn = true;
      render(); // Lock board immediately during CPU computation timeout
      setTimeout(cpuMove, 500);
    }
  }

  function cpuMove() {
    if (gameOver) {
      isCpuTurn = false;
      return;
    }

    let move = findBestMove('O'); // Try to win
    if (move === null) move = findBestMove('X'); // Block X
    if (move === null && cells[4] === null) move = 4; // Take center
    
    if (move === null) {
      const emptyIndices = cells.map((val, idx) => val === null ? idx : null).filter(val => val !== null);
      if (emptyIndices.length > 0) {
        move = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      }
    }

    if (move !== null) {
      cells[move] = 'O';
      if (!checkGameState()) {
        current = 'X';
        statusEl.textContent = `${current}'s turn`;
      }
    }

    isCpuTurn = false;
    render();
  }

  function findBestMove(player) {
    for (const line of WIN_LINES) {
      const [a, b, c] = line;
      const vals = [cells[a], cells[b], cells[c]];
      if (vals.filter(v => v === player).length === 2 && vals.includes(null)) {
        return line[vals.indexOf(null)];
      }
    }
    return null;
  }

  function checkGameState() {
    const result = checkWinner();
    if (result) {
      endGame(result);
      return true;
    } else if (cells.every(c => c)) {
      endGame({ tie: true });
      return true;
    }
    return false;
  }

  function checkWinner() {
    for (const line of WIN_LINES) {
      const [a, b, c] = line;
      if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
        return { winner: cells[a], line };
      }
    }
    return null;
  }

  function endGame(result) {
    gameOver = true;
    isCpuTurn = false;
    if (result.tie) {
      statusEl.textContent = "It's a tie!";
      scores.T++;
      scoreTEl.textContent = scores.T;
    } else {
      statusEl.textContent = `${result.winner} wins!`;
      statusEl.classList.add('win');
      scores[result.winner]++;
      (result.winner === 'X' ? scoreXEl : scoreOEl).textContent = scores[result.winner];
      result.line.forEach(idx => {
        boardEl.children[idx].classList.add('win-cell');
      });
    }
    [...boardEl.children].forEach(btn => btn.disabled = true);
  }

  function render() {
    cells.forEach((val, i) => {
      const btn = boardEl.children[i];
      btn.textContent = val || '';
      btn.className = 'cell' + (val ? ' ' + val.toLowerCase() : '');
      // Disable cell if already filled, game is over, or it's currently the CPU's turn
      btn.disabled = !!val || gameOver || isCpuTurn;
    });
  }

  function setMode(cpuMode) {
    vsCpu = cpuMode;
    isCpuTurn = false;
    pvpBtn.classList.toggle('active', !vsCpu);
    pvcBtn.classList.toggle('active', vsCpu);
    resetScores();
    newRound();
  }

  function resetScores() {
    scores = { X: 0, O: 0, T: 0 };
    scoreXEl.textContent = '0';
    scoreOEl.textContent = '0';
    scoreTEl.textContent = '0';
  }

  function newRound() {
    cells = Array(9).fill(null);
    current = 'X';
    gameOver = false;
    isCpuTurn = false;
    statusEl.classList.remove('win');
    statusEl.textContent = "X's turn";
    render();
  }

  pvpBtn.addEventListener('click', () => setMode(false));
  pvcBtn.addEventListener('click', () => setMode(true));
  resetBtn.addEventListener('click', newRound);

  buildBoard();
  render();
</script>

</body>
</html>
